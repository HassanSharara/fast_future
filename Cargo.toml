[package]
name = "fast_future"
version = "0.1.0"
edition = "2024"


[dependencies]
async-task = "4.7"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# NOTE: keep panic = "unwind" (the default). Workers use catch_unwind so a
# panicking task cannot kill a worker thread.
